name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: |
          url=$(curl -sSL https://api.github.com/repos/rustwasm/wasm-pack/releases/latest | grep -o 'https://[^"]*x86_64-unknown-linux-musl.tar.gz' | head -1)
          curl -sSL "$url" -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo mv /tmp/wasm-pack-*/wasm-pack /usr/local/bin/
          wasm-pack --version

      - name: Build wasm pkg
        run: wasm-pack build --target web --out-dir docs/pkg --release --features wasm

      - name: Run native tests
        run: cargo test --test emulation

      - name: WASM smoke test
        run: node tools/wasm-smoke.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4